name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Pinned for reproducible builds: TL<year>-historic tags are
      # frozen snapshots of a finished TeX Live release (the Makefile
      # pins SOURCE_DATE_EPOCH; the container pins the toolchain).
      # Bump deliberately, then re-verify a release rebuilds byte-identical.
      image: texlive/texlive:TL2025-historic   # full TeX Live incl. Libertinus/Plex/Garamond
    env:
      # Ace (make epub-a11y) runs on the distro chromium instead of
      # downloading puppeteer's own copy inside the container.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling (uv, poppler, ghostscript, imagemagick, epubcheck, ace)
        run: |
          apt-get update -qq
          apt-get install -y -qq poppler-utils ghostscript imagemagick \
            default-jre-headless wget icc-profiles-free chromium nodejs npm
          wget -q https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          unzip -q epubcheck-5.3.0.zip -d /opt
          printf '#!/bin/sh\nexec java -jar /opt/epubcheck-5.3.0/epubcheck.jar "$@"\n' > /usr/local/bin/epubcheck
          chmod +x /usr/local/bin/epubcheck
          npm install -g @daisy/ace
          wget -qO- https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate everything
        run: make validate-all

      - name: Distribution artifacts (PDF/X-1a + ONIX)
        run: make pdfx onix

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: book-build
          path: |
            build/latex/book-print.pdf
            build/latex/book-ebook.pdf
            build/epub/*.epub
            build/cover/cover-kdp.pdf
            build/pdfx/*.pdf
            build/onix/*.xml
          retention-days: 14
