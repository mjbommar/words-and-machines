# ============================================================
# book.yaml — single source of truth for this book.
# Every title/author/ISBN in LaTeX, EPUB, covers, and KDP docs
# derives from this file. See docs/architecture/config-schema.md.
#
# Values containing TODO fail `make generated` (and every build)
# until filled in. The shipped sample values are intentionally
# placeholders; run scripts/init_book.py to personalize.
# ============================================================

book:
  title: "Instruction Sets, Programs, and Proofs"
  subtitle: "Semantics, Equivalence, and Optimization"
  author: "Michael J. Bommarito II"
  author_short: "Bommarito"          # running heads; defaults to author
  publisher: "Bommarito Press"
  imprint: ""
  year: 2026
  edition_statement: "First Edition"
  copyright_holder: ""            # defaults to author
  description: >-
    This textbook develops a precise account of fixed-width words, machine
    state, instruction semantics, program equivalence, and machine-code
    optimization. It begins with an architecture-neutral machine, then compares
    fundamental RISC and CISC design features through RISC-V and x86-64 case
    studies. Each main result has a defined scope, a concrete evidence
    artifact, and a checker that can reject a false claim or damaged proof.
    Worked examples connect human-scale arguments with solver queries, proof
    certificates, exhaustive searches, and kernel-checked reasoning.
  language: en-US

identifiers:
  # Leave blank until assigned. `make release` requires real identifiers for
  # every enabled format.
  isbn_print: ""
  isbn_epub: ""
  isbn_hardcover: ""
  lccn: ""

classification:
  bisac: ["COM051000", "COM011000", "MAT000000"]
  keywords: ["instruction set architecture", "SAT solving", "proof certificates", "SIMD", "RISC-V", "superoptimization", "formal verification"]
  audience: "academic"               # trade | academic | young-readers

formats:
  print: true
  epub: true
  hardcover: false

trim:
  # Canonical edition: technical-textbook 7x10. It supports a same-size KDP
  # hardcover, the 828-page B&W limit, and expanded distribution on white.
  # Other supported technical trims are 7.5x9.25 and 8x10; large textbook
  # trims are 8.25x11 and 8.5x11.
  preset: "7x10"
  paper: "white"                  # white | cream | groundwood |
                                  # standard-color | premium-color
  bleed: 0.125

typography:
  font_profile: "libertinus"      # libertinus | garamond | plex
  engine: "lualatex"              # lualatex | xelatex
  base_size: 11                   # 10 | 11 | 12

citations:
  style: "authoryear"             # authoryear | superscript
  bibliography_title: "Sources"

style:
  # Genre style profile layered over docs/guides/STYLE.md. See
  # docs/guides/styles/README.md. Options ship in docs/guides/styles/:
  #   narrative-nonfiction | practical-guide | technical-handson |
  #   young-readers. Leave empty for base STYLE.md behavior.
  profile: "technical-handson"

  # Set true when the title is also the name of the book's subject — a place,
  # a person, a ship — so running prose cannot avoid saying it and \BookTitle
  # in a sentence would be wrong the moment the book is retitled. Drops the
  # title (never the author) from check_style.py's ADR 0002 literal-metadata
  # check. Leave false for any book whose title is not its subject's name.
  title_is_subject: false

simplified_english:
  # Simplified Book English — the controlled-vocabulary layer (advisory).
  # Guide: docs/guides/SIMPLIFIED-ENGLISH.md. Report: `make simplified`.
  # Every key is optional; delete the block to take the defaults.
  enabled: true
  # Terms this book admits. Introduce each one in the prose anyway — the
  # entry says "this is our word", not "no explanation needed". `not:`
  # lists spellings that must never appear, so one concept keeps one name.
  # This is terminology policy, not reader evidence. Each term still needs an
  # in-place explanation at its first load-bearing use; see
  # docs/guides/PLAIN-ENGLISH.md.
  terms:
    - term: "artifact"
    - term: "checker"
    - term: "cost model"
    - term: "instruction set"
    - term: "ledger"
    - term: "negative control"
    - term: "object"
    - term: "scope"
    - term: "semantic package"
    - term: "state relation"
  # Abbreviations this book may use bare, beyond the ones everybody knows.
  abbreviations: ["ABI", "CISC", "CNF", "DRAT", "ISA", "PC", "RISC", "SAT", "SIMD", "SMT", "SMT-LIB", "SSA"]
  # Proper names whose official spelling is all capitals. Keep these separate
  # from abbreviations because there is no full form to introduce.
  names: []
  # Substitutions this book has decided are correct for its subject —
  # a computability book keeps "enumerate", a calculus book keeps
  # "with respect to". Takes phrases as well as words.
  ignore: []
  # Extra words to treat as core, and extra words to ban outright.
  allow: []
  deny: []
  # Optional report tuning. The default warns on recurring unintroduced
  # terms; `--advisory` also shows single-use terms as ideas.
  thresholds:
    unintroduced_min_uses: 2

modules:
  code: true
  verse: false                    # parallel-text verse (requires xelatex)
  boxes: true

editions:
  full:
    default: true
    frontmatter: [preface]
    introduction: ch00
    chapters:
      - ch01
      - ch02
      - ch03
      - ch04
      - ch05
      - ch06
      - ch07
      - ch08
      - ch09
      - ch10
      - ch11
      - ch12
      - ch13
      - ch14
      - ch15
      - ch16
  # essential:
  #   title_suffix: "Essential Edition"
  #   isbn_print: ""
  #   isbn_epub: ""
  #   chapters: [ch01, ch03]

publishing:
  platforms: ["kdp"]              # kdp | lulu-paperback | lulu-hardcover
  kindle_drm: false               # effectively permanent per title; since
                                  # 2026-01-20 buyers can download the
                                  # EPUB/PDF of DRM-free Kindle books
  # KDP's AI questionnaire, per content type. "generated" = an AI tool
  # created it (even with substantial edits after) -> must disclose;
  # "assisted" = you created it, AI edited/refined/checked -> no
  # disclosure required. See docs/publishing/KDP-TEMPLATE.md section 6.
  ai_disclosure:
    text: generated               # none | assisted | generated
    images: none                  # none | assisted | generated
    translations: none            # none | assisted | generated
    detail: "AI-drafted from author outlines; every chapter reviewed, fact-checked, and revised by the author."
    statement: >-
      Portions of this book were drafted and edited with the assistance of
      AI tools. All facts, citations, and final language were reviewed and
      verified by the author.
  price_usd_print: null
  price_usd_ebook: null
