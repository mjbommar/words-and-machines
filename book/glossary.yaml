# Reader glossary for the print and EPUB editions.
#
# Keep definitions shorter than the first-use explanations in the chapters.
# The chapter teaches the term; this file helps a reader recover it later.
# Add only terms that recur, carry a proof obligation, or name a boundary that
# the reader must remember across chapters.

entries:
  - term: "architectural state"
    definition: "The machine components that an instruction-set model exposes to software and uses to determine architectural behavior."
    see_also: "machine state; microarchitecture"
  - term: "basic block"
    definition: "A maximal instruction sequence entered at its first instruction and left only after its last instruction."
  - term: "carry out"
    definition: "The bit beyond a fixed word's highest position when an unsigned addition is evaluated at one extra bit of width."
    see_also: "signed overflow; wraparound"
  - term: "continuation"
    definition: "A permitted sequence of computation that runs after the program fragment currently being studied."
  - term: "data memory"
    definition: "The finite byte-addressed map that holds the mutable data state in the A0 teaching machine."
  - term: "effective address"
    definition: "The address value calculated from an instruction's address-forming operands before the memory access is attempted."
  - term: "execution trace"
    definition: "A sequence of machine states in which every adjacent pair is connected by the declared single-step relation."
  - term: "frame condition"
    definition: "The part of a transition rule that states which components of machine state remain unchanged."
  - term: "implicit effect"
    definition: "A state change required by an instruction even though the changed component is not printed as an operand."
  - term: "initial-state premise"
    definition: "A condition that restricts the machine states from which a claim promises to hold."
  - term: "invariant"
    definition: "A property that holds initially and is preserved by every relevant transition."
  - term: "little-endian"
    definition: "A byte order that stores the lowest-weight byte of a multibyte word at the lowest address."
  - term: "machine state"
    definition: "The complete information that a machine model uses to determine or constrain its next behavior."
    see_also: "architectural state"
  - term: "mask"
    definition: "A fixed-width word used to select, clear, preserve, or test chosen bit positions."
  - term: "observation"
    definition: "A declared function that selects the part of a machine result a claim requires two executions to agree on."
  - term: "operand form"
    definition: "A rule that says where an instruction obtains an input or destination and how that value is read or written."
  - term: "partial correctness"
    definition: "The claim that a program satisfies its postcondition whenever it terminates normally from an allowed initial state."
    see_also: "total correctness"
  - term: "program"
    definition: "A finite collection of encoded instructions together with the address and rules used to fetch and execute them."
  - term: "reachable state"
    definition: "A state obtained from an admitted initial state by zero or more declared machine steps."
  - term: "read footprint"
    definition: "The architectural information an instruction must inspect to determine its successor."
    see_also: "write footprint"
  - term: "rotation"
    definition: "A fixed-width bit operation that moves positions around a cycle without discarding any bit."
  - term: "serialization"
    definition: "An encoding of structured state or data as a sequence suitable for storage or transfer."
  - term: "signed overflow"
    definition: "The condition in which the mathematical signed result lies outside the range represented by the chosen word width."
    see_also: "carry out; wraparound"
  - term: "single step"
    definition: "One application of the machine's transition rule to a running state and the instruction selected for execution."
  - term: "total correctness"
    definition: "Partial correctness together with a proof that execution terminates under the stated premises."
  - term: "variant"
    definition: "A value in a well-founded order that decreases as a loop progresses and supports a termination argument."
  - term: "word"
    definition: "A fixed-width pattern of bits interpreted under explicitly declared operations and readings."
  - term: "wraparound"
    definition: "Fixed-width arithmetic returning to the low end of the representative range after crossing its upper boundary."
  - term: "write footprint"
    definition: "The architectural components an instruction may change during its transition."
    see_also: "read footprint"
  - term: "application binary interface"
    definition: "A binary-level agreement about calling, register use, stack layout, data representation, and other boundaries between separately built program components."
  - term: "branch prediction"
    definition: "A processor technique that guesses a control-transfer outcome or target before the architectural predicate has been resolved."
  - term: "canonical encoding"
    definition: "The one designated byte representation chosen for a decoded instruction when several byte strings could otherwise express the same operation."
  - term: "condition code"
    definition: "A stored arithmetic fact, such as zero, carry, sign, or overflow, that a later instruction may inspect."
  - term: "control-flow graph"
    definition: "A graph whose vertices represent program regions and whose edges represent possible transfers of control."
  - term: "control-flow integrity"
    definition: "A policy that restricts indirect control transfers to a declared set of permitted targets."
  - term: "decoder"
    definition: "A function that reads instruction bytes and returns either one structured instruction or a declared rejection."
  - term: "instruction encoding"
    definition: "The rule that represents a structured instruction as bytes or fixed-width fields."
  - term: "instruction semantics"
    definition: "The transition rule that assigns an instruction its effect on machine state."
  - term: "leaf procedure"
    definition: "A procedure whose reachable control flow makes no nested procedure call."
  - term: "link value"
    definition: "The continuation address recorded by a call-like control transfer for a later return."
  - term: "memory aliasing"
    definition: "The condition in which two access expressions may designate overlapping bytes in the same memory."
  - term: "memory safety"
    definition: "A property that restricts memory operations to objects, regions, lifetimes, and permissions allowed by the governing language or system policy."
  - term: "non-leaf procedure"
    definition: "A procedure with a reachable nested call and therefore an obligation to preserve its own continuation and required state."
  - term: "stack frame"
    definition: "The region of stack memory governed by one active procedure invocation's layout and preservation rules."
  - term: "tail call"
    definition: "A call performed by transferring the current procedure's continuation obligation to another procedure instead of adding a new return point."
  - term: "virtual address"
    definition: "An address interpreted through a translation and protection context before it identifies physical storage or a fault."
  - term: "bisimulation"
    definition: "A relation in which each side can match every admitted step of the other while preserving the relation."
  - term: "candidate language"
    definition: "The exact finite or recursively described set of programs allowed to compete in a search or minimality claim."
  - term: "certificate"
    definition: "A finite evidence object that a separate checker can validate without repeating the producer's entire search."
  - term: "constant time"
    definition: "A program property defined relative to a leakage model in which the declared observations do not vary with secret data."
  - term: "cost model"
    definition: "A function that assigns a declared cost to a candidate program in a stated machine and execution context."
  - term: "counterexample"
    definition: "A concrete admitted input or execution that violates a universal claim."
  - term: "evidence manifest"
    definition: "A record that binds a scoped claim to semantic inputs, artifacts, checking commands, expected outcomes, and controls."
  - term: "forward simulation"
    definition: "A state relation under which each source step can be matched by an allowed target execution while related states are preserved."
  - term: "independent checking"
    definition: "Validation by a checker whose logic and inputs are sufficiently separate from the evidence producer to catch relevant producer errors."
  - term: "kernel reconstruction"
    definition: "Rebuilding a result as a term or derivation accepted by a small proof-assistant kernel."
  - term: "memory injection"
    definition: "A relation mapping live source memory blocks and offsets into target blocks while preserving the required permissions and contents."
  - term: "minimality"
    definition: "The conjunction of a valid candidate at some cost and a lower bound excluding every cheaper candidate in the declared language."
  - term: "negative control"
    definition: "A deliberately false claim or damaged artifact that the same checking route must reject for a declared reason."
  - term: "noninterference"
    definition: "A two-execution property stating that changes to secret inputs cannot change the observations declared public."
  - term: "precondition"
    definition: "A predicate selecting the initial states or inputs on which a program claim promises to hold."
  - term: "program equivalence"
    definition: "Agreement of two programs under a declared precondition, observation, and treatment of outcomes."
  - term: "proof certificate"
    definition: "A certificate whose successful checking establishes a formal proof of the encoded claim."
  - term: "provenance"
    definition: "The recorded origin and transformation history of source material, semantic inputs, artifacts, and published evidence."
  - term: "refinement"
    definition: "A directional relation requiring every admitted behavior of an implementation to correspond to behavior allowed by its specification."
  - term: "refutation"
    definition: "A proof that a formula has no satisfying assignment."
  - term: "state relation"
    definition: "A predicate stating when states from the same or different machines represent corresponding situations."
  - term: "stuttering"
    definition: "A simulation allowance in which one machine takes finite internal steps while the related abstract state does not advance."
  - term: "superoptimization"
    definition: "Search for a lowest-cost program in an explicitly declared candidate language under a stated equivalence and cost model."
  - term: "translation validation"
    definition: "Checking a particular translation result rather than proving the translator correct for every possible input program."
  - term: "vacuous proof"
    definition: "A formally accepted argument that establishes a claim only because an unintended empty domain, false premise, or disconnected encoding removed the intended cases."
  - term: "verified compilation"
    definition: "Compilation accompanied by a proof that translated programs preserve the behaviors required by the source and target semantic contracts."
