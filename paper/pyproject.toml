[project]
name = "paper-template"
version = "0.1.0"
description = "Configurable LaTeX paper-production template for arXiv and SSRN"
requires-python = ">=3.11"
# The scripts are self-contained (PEP 723 inline metadata); `uv run` fetches
# their deps ephemerally. This block lists them only for editor/tooling use.
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
figures = ["matplotlib>=3.8"]

[tool.ruff]
line-length = 88
target-version = "py311"
